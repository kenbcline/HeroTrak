name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Dedicated test gate: runs before any matrix build job starts.
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests & Analyze
        run: |
          flutter analyze
          flutter test

  # Parses the base version (e.g. 1.0.1) from pubspec.yaml once and shares it
  # with the build matrix and the release job.
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.parse.outputs.base_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse pubspec version
        id: parse
        run: |
          base_version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "Resolved base version: $base_version"

  build:
    name: Build for ${{ matrix.platform.name }}
    needs: [test, version]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            target: macos
            archive_name: HeroTrak-macOS-Universal.zip

          - name: Windows
            os: windows-latest
            target: windows
            archive_name: HeroTrak-Windows-x64.zip

          - name: Linux
            os: ubuntu-latest
            target: linux
            archive_name: HeroTrak-Linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        if: matrix.platform.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config

      - name: Install Dependencies
        run: flutter pub get

      - name: Build App
        run: >
          flutter build ${{ matrix.platform.target }} --release
          --build-name=${{ needs.version.outputs.base_version }}
          --build-number=${{ github.run_number }}

      - name: Package Artifact (macOS)
        if: matrix.platform.target == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/HeroTrak.app" "dist/${{ matrix.platform.archive_name }}"

      - name: Package Artifact (Windows)
        if: matrix.platform.target == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\${{ matrix.platform.archive_name }}"

      - name: Package Artifact (Linux)
        if: matrix.platform.target == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.platform.archive_name }}" -C build/linux/x64/release bundle

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform.target }}
          path: dist/*

  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Publish Draft Release & Attach Assets
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.version.outputs.base_version }}+${{ github.run_number }}
          draft: true
          files: all-artifacts/*
          body: "Automated multi-platform production release featuring 6e Phase Economy, custom app icons across macOS/Windows, decoupled dual-panel navigation, and Goon templates."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}