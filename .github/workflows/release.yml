name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            target: macos
            archive_name: HeroTrak-macOS-Universal.zip

          - name: Windows
            os: windows-latest
            target: windows
            archive_name: HeroTrak-Windows-x64.zip

          - name: Linux
            os: ubuntu-latest
            target: linux
            archive_name: HeroTrak-Linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        if: matrix.platform.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests & Analyze
        run: |
          flutter analyze
          flutter test

      - name: Build App
        run: flutter build ${{ matrix.platform.target }} --release

      - name: Package Artifact (macOS)
        if: matrix.platform.target == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/HeroTrak.app" "dist/${{ matrix.platform.archive_name }}"

      - name: Package Artifact (Windows)
        if: matrix.platform.target == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\${{ matrix.platform.archive_name }}"

      - name: Package Artifact (Linux)
        if: matrix.platform.target == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.platform.archive_name }}" -C build/linux/x64/release bundle

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Publish Release & Attach Assets
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/*
          body: "Automated multi-platform production release featuring 6e Phase Economy, custom app icons across macOS/Windows, decoupled dual-panel navigation, and Goon templates."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}