<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- macOS Icon Base Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Hero Crest Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- macOS Squircle Background Layer -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Tactical Grid Overlay (Background Texture) -->
  <g opacity="0.12" stroke="#94A3B8" stroke-width="1.5">
    <line x1="96" y1="32" x2="96" y2="480" />
    <line x1="160" y1="32" x2="160" y2="480" />
    <line x1="224" y1="32" x2="224" y2="480" />
    <line x1="288" y1="32" x2="288" y2="480" />
    <line x1="352" y1="32" x2="352" y2="480" />
    <line x1="416" y1="32" x2="416" y2="480" />
    <line x1="32" y1="96" x2="480" y2="96" />
    <line x1="32" y1="160" x2="480" y2="160" />
    <line x1="32" y1="224" x2="480" y2="224" />
    <line x1="32" y1="288" x2="480" y2="288" />
    <line x1="32" y1="352" x2="480" y2="352" />
    <line x1="32" y1="416" x2="480" y2="416" />
  </g>

  <!-- Speed Chart Dial (12 Segment Ticks) -->
  <g transform="translate(256, 256)">
    <!-- Outer Track -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.8" filter="url(#glow)" />
    
    <!-- Inner Track -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4,4" />

    <!-- 12 Phase Ticks (Highlighting Hero 6e Phase Slots: 2, 4, 6, 8, 10, 12) -->
    <!-- Tick 12 (Top) -->
    <line x1="0" y1="-160" x2="0" y2="-136" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
    <!-- Tick 1 -->
    <line x1="80" y1="-138.5" x2="68" y2="-117.8" stroke="#475569" stroke-width="2" />
    <!-- Tick 2 -->
    <line x1="138.5" y1="-80" x2="117.8" y2="-68" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <!-- Tick 3 -->
    <line x1="160" y1="0" x2="136" y2="0" stroke="#475569" stroke-width="2" />
    <!-- Tick 4 -->
    <line x1="138.5" y1="80" x2="117.8" y2="68" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <!-- Tick 5 -->
    <line x1="80" y1="138.5" x2="68" y2="117.8" stroke="#475569" stroke-width="2" />
    <!-- Tick 6 -->
    <line x1="0" y1="160" x2="0" y2="136" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <!-- Tick 7 -->
    <line x1="-80" y1="138.5" x2="-68" y2="117.8" stroke="#475569" stroke-width="2" />
    <!-- Tick 8 -->
    <line x1="-138.5" y1="80" x2="-117.8" y2="68" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <!-- Tick 9 -->
    <line x1="-160" y1="0" x2="-136" y2="0" stroke="#475569" stroke-width="2" />
    <!-- Tick 10 -->
    <line x1="-138.5" y1="-80" x2="-117.8" y2="-68" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <!-- Tick 11 -->
    <line x1="-80" y1="-138.5" x2="-68" y2="-117.8" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Central Hero Shield / Initiative Chevron -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Angular Tactical Shield -->
    <path d="M 0,-65 L 50,-30 L 40,40 L 0,75 L -40,40 L -50,-30 Z" fill="url(#shieldGrad)" stroke="#FDE68A" stroke-width="3" />
    
    <!-- Central Lightning Chevron ("H" Initiative Mark) -->
    <path d="M -16,-25 L 0,-45 L 16,-25 L 8,-25 L 12,20 L -12,20 L -8,-25 Z" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>